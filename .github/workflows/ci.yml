name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # npm intermittently fails to install platform-specific optional deps
      # (rolldown native bindings; npm/cli#4828), reddening healthy builds.
      # Retry with a clean node_modules, keeping the lockfile for determinism.
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt); retrying"
            rm -rf node_modules
            sleep 5
          done
          exit 1
      - run: npm run build
      - run: npm test
      - run: npm pack --dry-run

  publish:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm ci; then exit 0; fi
            echo "::warning::npm ci failed (attempt $attempt); retrying"
            rm -rf node_modules
            sleep 5
          done
          exit 1
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
